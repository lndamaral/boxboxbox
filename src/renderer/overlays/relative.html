<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relative</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="relative.css">
</head>
<body>
  <div class="relative-card" id="card">
    <div class="rel-hdr">
      <div class="rel-hdr-left">
        <span class="rel-hdr-title">RELATIVE</span>
        <span class="rel-hdr-sep">&middot;</span>
        <span class="rel-hdr-track" id="trackName"></span>
      </div>
      <div class="rel-hdr-right">
        <span class="rel-hdr-session" id="sessionBadge"></span>
        <span class="rel-conn" id="connDot"></span>
      </div>
    </div>
    <div class="rel-cols" id="colHeaders">
      <span>P</span><span>CAR</span><span>DRIVER</span>
      <span class="right">iR</span><span class="center">SR</span>
      <span class="right">LAST</span><span class="right">DELTA</span>
    </div>
    <div class="relative-body" id="body"></div>
    <div class="rel-ftr">F9 EDIT &middot; F10 HIDE</div>
  </div>
  <script src="relative.js"></script>
</body>
</html>
