<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoxBoxBox — Control</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-display);
      background: #0c0e14;
      color: var(--text-primary);
      padding: var(--s-6);
      user-select: none;
    }

    h1 { font-size: 18px; font-weight: 700; margin-bottom: var(--s-2); }
    .subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: var(--s-6); }

    .status {
      display: flex; align-items: center; gap: var(--s-3);
      margin-bottom: var(--s-6); font-size: 13px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted); transition: background 0.3s;
    }
    .status-dot.connected { background: var(--pos-good); }
    .status-label { color: var(--text-secondary); }

    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: var(--s-4);
    }

    /* Overlay toggle rows */
    .overlay-list { display: flex; flex-direction: column; gap: var(--s-2); }

    .overlay-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface-elev); border: 1px solid var(--border);
      border-radius: var(--r-md); padding: var(--s-3) var(--s-5);
    }

    .overlay-name { font-size: 13px; font-weight: 600; }

    /* Toggle switch */
    .toggle {
      position: relative; width: 36px; height: 20px;
      background: var(--surface-elev-hi); border-radius: 10px;
      cursor: pointer; transition: background 0.2s;
      border: 1px solid var(--border-strong);
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; transition: left 0.2s;
    }
    .toggle.on .toggle-knob { left: 18px; }

    /* Controls */
    .controls {
      margin-top: var(--s-6); display: flex; flex-direction: column; gap: var(--s-3);
    }
    .control-row { display: flex; gap: var(--s-3); }
    .control-row .btn { flex: 1; }

    .btn {
      font-family: var(--font-display); font-size: 12px; font-weight: 500;
      padding: var(--s-2) var(--s-4); border-radius: var(--r-sm);
      border: 1px solid var(--border-strong); background: var(--surface-elev);
      color: var(--text-secondary); cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: var(--surface-elev-hi); color: var(--text-primary); }
    .btn.active { border-color: var(--accent); color: var(--accent); }

    .shortcuts {
      margin-top: var(--s-6); font-size: 11px;
      color: var(--text-muted); line-height: 1.6;
    }
    kbd {
      font-family: var(--font-mono); font-size: 10px;
      background: var(--surface-elev-hi); border: 1px solid var(--border-strong);
      border-radius: var(--r-sm); padding: 1px 5px;
    }
  </style>
</head>
<body>
  <h1>BoxBoxBox</h1>
  <p class="subtitle">Modern overlays for iRacing</p>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Disconnected</span>
  </div>

  <p class="section-title">Overlays</p>

  <div class="overlay-list" id="overlayList">
    <div class="overlay-row" data-id="relative">
      <span class="overlay-name">Relative</span>
      <div class="toggle on"><div class="toggle-knob"></div></div>
    </div>
    <div class="overlay-row" data-id="inputs">
      <span class="overlay-name">Inputs</span>
      <div class="toggle on"><div class="toggle-knob"></div></div>
    </div>
    <div class="overlay-row" data-id="fuel">
      <span class="overlay-name">Fuel</span>
      <div class="toggle on"><div class="toggle-knob"></div></div>
    </div>
    <div class="overlay-row" data-id="tires">
      <span class="overlay-name">Tires</span>
      <div class="toggle on"><div class="toggle-knob"></div></div>
    </div>
    <div class="overlay-row" data-id="trackmap">
      <span class="overlay-name">Track Map</span>
      <div class="toggle"><div class="toggle-knob"></div></div>
    </div>
    <div class="overlay-row" data-id="standings">
      <span class="overlay-name">Standings</span>
      <div class="toggle on"><div class="toggle-knob"></div></div>
    </div>
    <div class="overlay-row" data-id="spotter">
      <span class="overlay-name">Spotter</span>
      <div class="toggle on"><div class="toggle-knob"></div></div>
    </div>
  </div>

  <div class="controls">
    <p class="section-title">Controls</p>
    <div class="control-row">
      <button class="btn" id="btnEdit">Edit mode</button>
      <button class="btn" id="btnToggle">Hide overlays</button>
    </div>
  </div>

  <div class="shortcuts">
    <kbd>F9</kbd> Toggle edit mode<br>
    <kbd>F10</kbd> Toggle overlay visibility
  </div>

  <script>
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const btnEdit = document.getElementById('btnEdit');
    const btnToggle = document.getElementById('btnToggle');

    // Toggle switches
    document.querySelectorAll('.overlay-row').forEach(row => {
      const id = row.dataset.id;
      const toggle = row.querySelector('.toggle');
      toggle.addEventListener('click', () => {
        const enabled = !toggle.classList.contains('on');
        toggle.classList.toggle('on', enabled);
        window.overlayAPI.toggleOverlay(id, enabled);
      });
    });

    window.overlayAPI.onConnectionState((connected) => {
      statusDot.classList.toggle('connected', connected);
      statusLabel.textContent = connected ? 'Connected' : 'Disconnected';
    });

    window.overlayAPI.onEditMode((enabled) => {
      btnEdit.classList.toggle('active', enabled);
      btnEdit.textContent = enabled ? 'Exit edit' : 'Edit mode';
    });

    window.overlayAPI.onOverlaysVisible((visible) => {
      btnToggle.textContent = visible ? 'Hide overlays' : 'Show overlays';
    });

    btnEdit.addEventListener('click', () => window.overlayAPI.toggleEditMode());
    btnToggle.addEventListener('click', () => window.overlayAPI.toggleVisibility());
  </script>
</body>
</html>
